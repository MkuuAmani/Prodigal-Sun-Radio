<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050914">
<meta name="description" content="Listen live to Prodigal Sun Radio. Where The Mix Never Sleeps.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<title>Prodigal Sun Radio</title>
<style>
:root{color-scheme:dark;--gold:#d7b45a;--gold2:#f5df9b;--navy:#071326}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% 28%,#183052 0,#0a1427 38%,#03060d 78%);color:#f7f2e7;font-family:Arial,Helvetica,sans-serif;display:grid;place-items:center;padding:24px}
main{width:min(100%,430px);text-align:center;padding:30px 22px 26px;border:1px solid rgba(215,180,90,.28);border-radius:28px;background:linear-gradient(160deg,rgba(15,31,54,.88),rgba(3,7,15,.94));box-shadow:0 22px 70px #0009}
.sun{width:116px;height:116px;margin:4px auto 22px;border-radius:50%;border:1px solid #d7b45a88;display:grid;place-items:center;background:radial-gradient(circle,#f6d989 0,#d7a83f 12%,#4a3618 38%,#101c30 70%);box-shadow:0 0 45px #d7a83f35}
.sun span{font-size:39px;color:#fff1c3;text-shadow:0 0 18px #f6d989}
.eyebrow{letter-spacing:.32em;font-size:10px;color:var(--gold);margin:0 0 12px}
h1{font-size:clamp(25px,7vw,34px);letter-spacing:.09em;line-height:1.15;margin:0;font-weight:700}
.tag{font-size:11px;letter-spacing:.22em;color:#d9c58f;margin:12px 0 34px}
.status{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:#c6cbd3;margin-bottom:18px}
button{border:0;cursor:pointer;color:#10121a}
#play{width:112px;height:112px;border-radius:50%;font-size:17px;font-weight:bold;letter-spacing:.12em;background:linear-gradient(145deg,#fff0b4,#d4a944 58%,#9d7628);box-shadow:0 0 0 8px #d7b45a16,0 10px 35px #0009}
#play:disabled{opacity:.65;cursor:wait}
.controls{display:flex;justify-content:center;gap:14px;margin-top:22px}
.small{background:#17243a;color:#f5df9b;border:1px solid #d7b45a66;border-radius:30px;padding:11px 19px;font-size:12px}
.note{font-size:12px;line-height:1.6;color:#aeb8c7;margin:28px auto 0;max-width:290px}
footer{font-size:10px;letter-spacing:.18em;color:#a58b4e;margin-top:28px}
a{color:#e7ca7c;text-decoration:none}
</style>
</head>
<body>
<main>
  <div class="sun" aria-hidden="true"><span>☀</span></div>
  <p class="eyebrow">24/7 ONLINE RADIO</p>
  <h1>PRODIGAL SUN<br>RADIO</h1>
  <p class="tag">WHERE THE MIX NEVER SLEEPS</p>
  <div class="status" id="status" aria-live="polite">READY TO LISTEN</div>
  <button id="play" aria-label="Play Prodigal Sun Radio">PLAY</button>
  <div class="controls">
    <button class="small" id="stop">STOP</button>
    <button class="small" id="site">PSR WEBSITE ↗</button>
  </div>
  <p class="note">Live radio, wherever you are.<br>Keep this app open or return to your home screen while listening.</p>
  <footer><a href="https://www.prodigalsunradio.com/">PRODIGALSUNRADIO.COM</a></footer>
  <audio id="audio" preload="none" playsinline></audio>
</main>
<script>
const STREAM = "https://listen.radioking.com/radio/443393/stream/497783";
const audio = document.getElementById("audio");
const play = document.getElementById("play");
const statusEl = document.getElementById("status");
let busy = false;
audio.src = STREAM;
function setState(playing) {
  play.textContent = playing ? "PAUSE" : "PLAY";
  play.setAttribute("aria-label", playing ? "Pause Prodigal Sun Radio" : "Play Prodigal Sun Radio");
  statusEl.textContent = playing ? "ON AIR · YOU'RE LISTENING" : "READY TO LISTEN";
  if ("mediaSession" in navigator) {
    navigator.mediaSession.playbackState = playing ? "playing" : "paused";
  }
}
async function start() {
  if (busy) return;
  busy = true; play.disabled = true; statusEl.textContent = "CONNECTING…";
  try { await audio.play(); setState(true); }
  catch(e) { statusEl.textContent = "COULDN'T CONNECT · TRY AGAIN"; setState(false); }
  finally { busy = false; play.disabled = false; }
}
play.addEventListener("click", () => audio.paused ? start() : audio.pause());
document.getElementById("stop").addEventListener("click", () => { audio.pause(); audio.currentTime = 0; setState(false); });
document.getElementById("site").addEventListener("click", () => window.open("https://www.prodigalsunradio.com/","_blank","noopener"));
audio.addEventListener("playing", () => setState(true));
audio.addEventListener("pause", () => setState(false));
audio.addEventListener("waiting", () => statusEl.textContent = "BUFFERING…");
audio.addEventListener("error", () => { statusEl.textContent = "STREAM UNAVAILABLE · TRY AGAIN"; setState(false); });
if ("mediaSession" in navigator) {
  navigator.mediaSession.metadata = new MediaMetadata({
    title: "Prodigal Sun Radio", artist: "Where The Mix Never Sleeps",
    album: "Live Radio", artwork: [
      {src:"icon-192.png",sizes:"192x192",type:"image/png"},
      {src:"icon-512.png",sizes:"512x512",type:"image/png"}
    ]
  });
  navigator.mediaSession.setActionHandler("play", start);
  navigator.mediaSession.setActionHandler("pause", () => audio.pause());
  navigator.mediaSession.setActionHandler("stop", () => { audio.pause(); audio.currentTime=0; setState(false); });
}
if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
  window.addEventListener("load", () => navigator.serviceWorker.register("./sw.js").catch(()=>{}));
}
</script>
</body>
</html>
