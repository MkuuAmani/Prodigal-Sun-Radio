<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050914">
<meta name="description" content="Listen live to Prodigal Sun Radio. Where The Mix Never Sleeps.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<title>Prodigal Sun Radio</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#03060d}
body{font-family:Arial,Helvetica,sans-serif}
.stage{position:relative;width:100vw;height:100dvh;display:flex;justify-content:center;align-items:center;background:#03060d}
.art{height:100%;width:100%;object-fit:contain;display:block}
.controls{position:absolute;left:0;right:0;top:76.5%;height:8%;display:flex;align-items:center;justify-content:center;pointer-events:none}
button{pointer-events:auto;border:0;background:transparent;color:transparent;cursor:pointer;-webkit-tap-highlight-color:transparent}
#play{width:min(19vw,94px);height:min(19vw,94px);border-radius:50%;outline:0}
#stop{position:absolute;right:7%;width:min(12vw,58px);height:min(12vw,58px);border-radius:14px}
#status{position:absolute;top:68.3%;left:0;right:0;text-align:center;color:#f4d47f;font-size:11px;letter-spacing:.18em;text-shadow:0 1px 5px #000;pointer-events:none}
#hint{position:absolute;bottom:env(safe-area-inset-bottom,0);left:0;right:0;text-align:center;color:#d9c58f;background:#050914cc;font-size:10px;padding:7px;letter-spacing:.08em;opacity:0;transition:opacity .3s}
#hint.show{opacity:1}
audio{display:none}
</style>
</head>
<body>
<div class="stage">
  <img class="art" src="psr-wallpaper.png" alt="Prodigal Sun Radio — Where The Mix Never Sleeps">
  <div id="status" aria-live="polite">READY TO LISTEN</div>
  <div class="controls">
    <button id="play" aria-label="Play Prodigal Sun Radio" title="Play or pause"></button>
    <button id="stop" aria-label="Stop Prodigal Sun Radio" title="Stop"></button>
  </div>
  <div id="hint">PSR LIVE PLAYER</div>
  <audio id="audio" preload="none" playsinline></audio>
</div>
<script>
const STREAM="https://listen.radioking.com/radio/443393/stream/497783";
const audio=document.getElementById("audio"), play=document.getElementById("play");
const statusEl=document.getElementById("status"), hint=document.getElementById("hint");
audio.src=STREAM;
let busy=false;
function state(on){statusEl.textContent=on?"ON AIR · YOU'RE LISTENING":"READY TO LISTEN";
 play.setAttribute("aria-label",on?"Pause Prodigal Sun Radio":"Play Prodigal Sun Radio");
 if("mediaSession" in navigator) navigator.mediaSession.playbackState=on?"playing":"paused";}
async function start(){if(busy)return;busy=true;statusEl.textContent="CONNECTING…";
 try{await audio.play();state(true);}catch(e){statusEl.textContent="CONNECTION FAILED · TAP TO RETRY";state(false);}
 finally{busy=false;}}
play.addEventListener("click",()=>audio.paused?start():audio.pause());
document.getElementById("stop").addEventListener("click",()=>{audio.pause();audio.currentTime=0;state(false);});
audio.addEventListener("playing",()=>state(true));
audio.addEventListener("pause",()=>state(false));
audio.addEventListener("waiting",()=>statusEl.textContent="BUFFERING…");
audio.addEventListener("error",()=>{statusEl.textContent="STREAM UNAVAILABLE · TRY AGAIN";state(false);});
if("mediaSession" in navigator){
 navigator.mediaSession.metadata=new MediaMetadata({title:"Prodigal Sun Radio",artist:"Where The Mix Never Sleeps",album:"Live Radio",artwork:[{src:"icon-192.png",sizes:"192x192",type:"image/png"}]});
 navigator.mediaSession.setActionHandler("play",start);
 navigator.mediaSession.setActionHandler("pause",()=>audio.pause());
 navigator.mediaSession.setActionHandler("stop",()=>{audio.pause();audio.currentTime=0;state(false);});
}
if("serviceWorker" in navigator && location.protocol.startsWith("http")) addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}));
</script>
</body>
</html>
